  <title>Stack &amp; Siege v3.111.7</title>  <style>    /* iOS-Lupen-Fix (v3.32.1): user-select auf html/body reicht Safari
    nicht — die Text-Lupe erschien beim Ziehen über HUD-/Shop-Texte. Global
    deaktivieren + Long-Press-Callout & Tap-Highlight aus; Eingabefelder
    behalten Textauswahl (Regel darunter). */
    *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
    input,textarea{-webkit-user-select:text;user-select:text}
    :root{
      --bg-0:#02060f; --bg-1:#050b18; --bg-2:#0a1426;
      --glass:rgba(255,255,255,0.045); --glass-2:rgba(255,255,255,0.07);
      --glass-bd:rgba(255,255,255,0.10); --glass-bd-strong:rgba(255,255,255,0.16);
      --txt:#eef2f9; --muted:#7c8aa3; --faint:#475569;
      --p1:#3b82f6; --p2:#ef4444; --p3:#10b981;
      --cyan:#22d3ee; --violet:#a78bfa; --amber:#fbbf24;
      --shadow:0 12px 40px rgba(0,0,0,0.55); --shadow-sm:0 4px 18px rgba(0,0,0,0.4);
    }
    :root{--sa-top:env(safe-area-inset-top,0px);--sa-bottom:env(safe-area-inset-bottom,0px);--sa-left:env(safe-area-inset-left,0px);--sa-right:env(safe-area-inset-right,0px)}
    /* box-sizing ist hier KEINE Feinheit: ohne es addiert sich die
       Sicherheitspolsterung auf die vollen 100dvh, der Koerper wird
       hoeher als der Bildschirm, und overflow:hidden schneidet unten ab.
       Genau so verschwand auf dem iPhone die Fusszeile des Menues.

       Die Polsterung steht an GENAU EINER Stelle: am Koerper. Als sie in
       v3.84.0 noch fuer html UND body galt, zog jedes der beiden Elemente
       denselben Rand ein — oben blieb ein toter Streifen von der Hoehe des
       Sicherheitsbereichs stehen (auf dem iPhone 59 px), und unten ragte der
       Koerper um dieselbe Strecke aus dem Bildschirm heraus. html traegt
       deshalb nur noch Hoehe, Grund und Ueberlauf. */
    html{box-sizing:border-box;height:100dvh;background:#02060f;overflow:hidden;touch-action:none}
    body{box-sizing:border-box;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding-top:var(--sa-top);padding-bottom:var(--sa-bottom);padding-left:var(--sa-left);padding-right:var(--sa-right);color:#eef2f9;font-family:'Segoe UI',system-ui,sans-serif}
    body{background:radial-gradient(ellipse 120% 80% at 50% -10%,#102036 0%,#081225 38%,#040a16 70%,#02060f 100%)}
    #root{height:100%}
    #splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse 120% 90% at 50% 12%,#13243f 0%,#081326 45%,#02060f 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease}
    /* Die 54 px waren fuer einen kurzen Namen gewaehlt. „Stack & Siege" ist
       deutlich laenger und stiess auf einem 402 px breiten Schirm links und
       rechts an den Rand — auf schmaleren Geraeten haette es geschnitten.
       Jetzt waechst der Schriftgrad mit der Breite und behaelt einen Rand. */
    #splash h1{font-family:'Segoe UI',system-ui,sans-serif;font-size:clamp(30px,10.5vw,54px);font-weight:900;letter-spacing:-0.045em;margin-top:16px;padding:0 18px;max-width:100%;text-align:center;background:linear-gradient(120deg,#22d3ee 0%,#60a5fa 45%,#a78bfa 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 26px rgba(56,189,248,0.35))}
    #splash p{color:#64748b;font-family:system-ui;font-size:13px;margin-top:4px;letter-spacing:0.04em}
    #splash-bar{width:54px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:28px;overflow:hidden}
    #splash-bar span{display:block;height:100%;width:35%;background:linear-gradient(90deg,#22d3ee,#a78bfa);border-radius:2px;animation:sl 1s ease-in-out infinite;box-shadow:0 0 12px rgba(56,189,248,0.6)}
    @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(390%)}}
    @keyframes radarSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    /* Nur noch WAAGERECHT zentriert (v3.85.0). Das -50% in der Senkrechten
       zog das Schild um seine halbe Hoehe nach oben — bei top:96px lag seine
       Oberkante damit auf 52px und damit mitten in der Kopfzeile. Jetzt
       haengt es an seiner Oberkante, und die setzt der Spielcode direkt
       unter die gemessene Kopfzeile. */
    @keyframes phasebanner{0%{opacity:0;transform:translateX(-50%) scale(0.75)}14%{opacity:1;transform:translateX(-50%) scale(1.04)}20%{transform:translateX(-50%) scale(1)}76%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(0.93)}}
    /* ── Tablet-Massstab (v3.87.0) ────────────────────────────────────────
       Menue und Ergebnis sind fuer ein Telefon gesetzt: eine Spalte von
       440 px, Karten von 320 px, Schrift in festen Pixeln. Auf einem iPad
       von 1024 px Breite strandet das als schmaler Streifen in der Mitte —
       gemessen: die Spalte fuellt 43 %, die Ergebniskarten 31 % der Breite.
       Das ist kein Fehler, es ist eine Telefon-Oberflaeche in einem grossen
       Rahmen, und genau so sieht sie aus.

       `zoom` vergroessert Spalte UND Schrift in einem Zug. Es wirkt — anders
       als `transform: scale()` — auf das Layout: der rollbare Kasten weiss
       weiterhin, wie hoch sein Inhalt ist, und was nicht mehr passt, bleibt
       erreichbar. Mit einer Transformation waere der obere Rand eines zu
       hohen Inhalts unerreichbar geworden.

       NICHT auf das Spielfeld: `fit()` rechnet dort mit gemessenen Pixeln
       (Brettgroesse, Kopfzeilenhoehe, Unterleiste). Eine Zoomstufe im Spiel
       hiesse, dass gemessene und gezeichnete Pixel auseinanderlaufen — genau
       der Fehler, der in v3.84.0/v3.85.0 die Unterleiste abgeschnitten hat.
       Das Brett fuellt im Hochformat ohnehin schon 68-73 % des iPads, also
       genauso viel wie auf dem iPhone; dort ist nichts zu holen.

       Zwei Stufen statt stufenlos: So gibt es genau zwei Zustaende zu pruefen.
       Die Hoehenbedingung haelt Telefone im Querformat heraus (852x393). */
    @media (min-width:700px) and (min-height:900px){
      .gross-spalte{zoom:1.34}
      .gross-schirm > *{zoom:1.34}
      .gross-schirm > .kein-zoom{zoom:1}
    }
    @media (min-width:960px) and (min-height:1200px){
      .gross-spalte{zoom:1.5}
      .gross-schirm > *{zoom:1.5}
      .gross-schirm > .kein-zoom{zoom:1}
    }
    /* Und in die andere Richtung (v3.89.0). Gemessen passte das Menue auf zwei
       Geraeten NICHT auf den Schirm — die Fusszeile mit Impressum und
       Datenschutz lag unter der Kante, man musste rollen, um sie zu sehen:

         iPhone SE       667 hoch; nach Sicherheitsbereichen und Polsterung
                         bleiben 615 — die Spalte ist 720.
         iPhone 13 mini  812 hoch; es bleiben 696 — die Spalte ist 720.

       Derselbe Regler wie oben, nur kleiner. Die Stufen sind an diesen zwei
       Messungen abgelesen, nicht geraten; die dritte faengt die alten
       568er-Schirme ab. `max-width:699px` haelt Tabletts und Rechner heraus:
       Ein Fenster von 1280x800 ist niedrig, aber nicht eng, und soll nicht
       schrumpfen. Wo es trotzdem nicht reicht, rollt der Kasten wie bisher —
       es geht nichts verloren, es ist nur unbequem. */
    @media (max-width:699px) and (max-height:830px) and (min-height:701px){ .gross-spalte{zoom:.95} }
    @media (max-width:699px) and (max-height:700px) and (min-height:621px){ .gross-spalte{zoom:.84} }
    @media (max-width:699px) and (max-height:620px){ .gross-spalte{zoom:.70} }
    @keyframes glowpulse{0%,100%{opacity:0.6}50%{opacity:1}}
    @keyframes lvlUpFlash{0%{opacity:0;transform:scale(0.8)}40%{opacity:1;transform:scale(1.1)}70%{transform:scale(0.96)}100%{opacity:1;transform:scale(1)}}
    @keyframes xpBarGlow{0%,100%{box-shadow:0 0 6px rgba(124,58,237,0.5)}50%{box-shadow:0 0 16px rgba(34,211,238,0.9)}}
    @keyframes xpNumPop{0%{opacity:0;transform:scale(0.7) translateY(6px)}60%{transform:scale(1.12) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}

    @keyframes coachPop{0%{transform:translateY(10px) scale(0.94);opacity:0}55%{transform:translateY(-3px) scale(1.04)}100%{transform:translateY(0) scale(1);opacity:1}}
    @keyframes coachDim{to{opacity:0.42}}
    @keyframes coachFlash{0%{box-shadow:0 0 0 3px rgba(255,255,255,0.0),0 8px 30px rgba(0,0,0,0.55)}30%{box-shadow:0 0 0 3px rgba(255,255,255,0.9),0 8px 30px rgba(0,0,0,0.55)}100%{box-shadow:0 0 0 3px rgba(255,255,255,0.0),0 8px 30px rgba(0,0,0,0.55)}}
    @keyframes dangerGlow{0%,100%{box-shadow:0 0 0 2px rgba(239,68,68,0.25),0 8px 40px rgba(0,0,0,0.7)}50%{box-shadow:0 0 0 3px rgba(239,68,68,0.85),0 0 50px rgba(239,68,68,0.45),0 8px 40px rgba(0,0,0,0.7)}}
