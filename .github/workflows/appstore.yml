name: App Store (Stand / Eintragen)

# Fragt App Store Connect, was heute wirklich dort steht — und traegt auf
# Wunsch ein, was aus dem Repository kommt.
#
# **Warum ueber einen Ablauf und nicht von Hand.** Der Schluessel liegt in den
# Secrets und verlaesst sie nie. Wer das Skript lokal fahren will, braucht den
# Schluessel auf der Platte; hier braucht es nur einen Knopf.
on:
  workflow_dispatch:
    inputs:
      modus:
        description: 'Was soll passieren?'
        type: choice
        default: stand
        options:
          - stand      # nur lesen und berichten
          - anlegen    # zusaetzlich die App-ID registrieren
          - fuellen    # zusaetzlich Texte und Pruefhinweise eintragen
          - testflight # internen Tester-Kreis einrichten, Bau zuordnen
          - marktreif  # nur lesen: was fehlt bis zur Einreichung im Store?
          - beta-stand # nur lesen: nimmt die oeffentliche Beta Tester an?
          - store-probe # Trockenlauf: was wuerde eingetragen?
          - store      # Kategorie, Altersfreigabe, Bau, Bildschirmfotos eintragen
          - oeffentlich # zusaetzlich: externe Gruppe mit oeffentlichem Link
                        # + Beta-Pruefung beantragen. Damit kann JEDER testen.

permissions:
  contents: read

jobs:
  fragen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Zwei Laeufe gleichzeitig wuerden dieselben Felder gegeneinander schreiben.
    concurrency:
      group: appstore
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten
        run: pip install --quiet "pyjwt[crypto]" requests

      - name: Zugang pruefen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          fehlt=""
          [ -n "$ASC_KEY_ID" ]    || fehlt="$fehlt ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || fehlt="$fehlt ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || fehlt="$fehlt ASC_KEY_P8"
          if [ -n "$fehlt" ]; then
            echo "::error::Diese Geheimnisse fehlen:$fehlt — siehe IOS-SETUP.md"
            exit 1
          fi

      - name: App Store Connect fragen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # Optional: ohne diese drei bleibt der Kontakt fuer die Pruefung leer.
          # Private Kontaktdaten gehoeren in Secrets, nicht ins Repository.
          ASC_KONTAKT_NAME: ${{ secrets.ASC_KONTAKT_NAME }}
          ASC_KONTAKT_MAIL: ${{ secrets.ASC_KONTAKT_MAIL }}
          ASC_KONTAKT_TELEFON: ${{ secrets.ASC_KONTAKT_TELEFON }}
        run: |
          case "${{ inputs.modus }}" in
            anlegen)    python3 scripts/asc.py --anlegen ;;
            fuellen)    python3 scripts/asc.py --fuellen ;;
            testflight)  python3 scripts/asc-testflight.py ;;
            oeffentlich) python3 scripts/asc-testflight.py --oeffentlich ;;
            marktreif)  python3 scripts/asc-marktreif.py ;;
            # Liest je Bau der oeffentlichen Gruppe den Pruefzustand und sagt
            # ja/nein. Genau die Frage, an der der Knopf auf der Website haengt
            # — und die man sonst nur beantworten kann, indem man etwas
            # SCHREIBT (`oeffentlich`). Reines Lesen gehoert als eigener Modus
            # hierher, sonst schreibt irgendwann jemand nur, um nachzusehen.
            beta-stand) python3 scripts/testflight-stand.py ;;
            store-probe) python3 scripts/asc-store.py --alles --trocken ;;
            store)      python3 scripts/asc-store.py --alles ;;
            *)          python3 scripts/asc.py --stand ;;
          esac
