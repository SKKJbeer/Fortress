# App Check (Firebase) — Bestandsaufnahme und Einrichtung.
#
# Beide Zugaenge liegen ausschliesslich in den Secrets: FIREBASE_SA_JSON
# (Dienstkonto, umgeht alle Regeln) und ASC_KEY_P8 (App Store Connect).
# Dieser Ablauf ist der einzige Weg, auf dem sie hier zusammenkommen.
name: App Check

on:
  workflow_dispatch:
    inputs:
      modus:
        description: 'Was soll passieren?'
        type: choice
        default: stand
        options:
          - stand      # nur lesen: was gibt es, was darf der Zugang?
          - apple-faehigkeit  # App Attest an der Bundle-Kennung einschalten
          - einrichten # iOS-App registrieren, App Attest + reCAPTCHA als Anbieter (OHNE Durchsetzung)
          - recaptcha-pruefen  # passt das Secret zum Site-Key? (braucht 'token')
      token:
        description: 'Nur fuer recaptcha-pruefen: ein frisches reCAPTCHA-Token (gilt 2 Minuten)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: appcheck
  cancel-in-progress: false

jobs:
  appcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten
        # recaptcha-pruefen kommt mit der Standardbibliothek aus — und hat es
        # eilig: Das Token gilt nur zwei Minuten.
        if: inputs.modus != 'recaptcha-pruefen'
        run: pip install --quiet google-auth requests "pyjwt[crypto]"
      - name: App Check
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Ueber die Umgebung, NICHT in das Skript eingesetzt: Eine Eingabe ist
          # Text von aussen und gehoert nie direkt in eine Shell-Zeile.
          RECAPTCHA_TOKEN: ${{ inputs.token }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          case "${{ inputs.modus }}" in
            apple-faehigkeit) python3 scripts/appcheck.py --apple-faehigkeit ;;
            einrichten) python3 scripts/appcheck.py --einrichten ;;
            recaptcha-pruefen) python3 scripts/appcheck.py --recaptcha-pruefen ;;
            *) python3 scripts/appcheck.py --stand ;;
          esac
