name: Website veröffentlichen

# **Die Website geht bei jeder Änderung von selbst online.**
#
# Sie liegt als fertige Dateien in `docs/website/` — kein Bauwerkzeug, keine
# Abhängigkeiten, nichts zu übersetzen. Cloudflare Pages nimmt genau das
# entgegen und legt es auf sein Netz.
#
# Warum ein Ablauf und nicht die Anbindung ans Repository, die Cloudflare
# selbst anbietet: Dann läge der Auslöser bei Cloudflare, und die Prüfung hier
# hätte kein Wort mitzureden. So geht nur online, was `check-website.mjs`
# durchgelassen hat — und dieselbe Prüfung sagt „nein", solange noch eine
# eckige Klammer im Impressum steht.
#
# ---
#
# **Einmalig einzurichten** (alles kostenlos):
#
#   1. Cloudflare-Konto anlegen, Bereich „Workers & Pages".
#   2. Ein API-Token erzeugen mit der Berechtigung „Cloudflare Pages: Edit".
#   3. Im Repository unter Settings › Secrets and variables › Actions zwei
#      Geheimnisse anlegen:
#        CLOUDFLARE_API_TOKEN    das Token aus Schritt 2
#        CLOUDFLARE_ACCOUNT_ID   steht in der Adresszeile des Dashboards
#
# Das Pages-Projekt legt der Ablauf selbst an — ein Schritt, den ein Token
# erledigen kann, gehört nicht auf eine Klickliste.

on:
  push:
    branches: [main]
    paths:
      - "docs/website/**"
      - "public/impressum.html"
      - "public/privacy.html"
      - "public/agb.html"
      - "scripts/website-bauen.sh"
      - "scripts/check-website.mjs"
      - ".github/workflows/website.yml"
  # **Taeglich, und das hat genau einen Grund.** Der TestFlight-Knopf haengt
  # an einer Freigabe durch Apple — die passiert ausserhalb dieses
  # Repositories, also aendert sich dabei keine Datei, also loest kein Push
  # aus. Ohne diesen Takt bliebe der Knopf weg, bis jemand von Hand nachfragt.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      nur_zugang:
        description: 'Nur den Cloudflare-Zugang prüfen, nichts veröffentlichen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

env:
  PROJEKT: stack-and-siege

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sind die Zugangsdaten da?
        id: zugang
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KONTO: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$KONTO" ]; then
            echo "bereit=nein" >> "$GITHUB_OUTPUT"
          else
            echo "bereit=ja" >> "$GITHUB_OUTPUT"
          fi

      # **Taugt das Token überhaupt?** Diese Frage beantwortet sonst erst der
      # erste echte Upload — und der steht hinter der Inhaltsprüfung. Wer das
      # Impressum ausfüllt und dann an einem abgelaufenen Token scheitert, hat
      # zwei Runden verloren statt einer. `project list` liest nur.
      - name: Cloudflare-Zugang prüfen
        if: inputs.nur_zugang && steps.zugang.outputs.bereit == 'ja'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "### Cloudflare-Zugang" >> $GITHUB_STEP_SUMMARY
          if npx --yes wrangler@3.90.0 pages project list; then
            echo "Token und Konto-Kennung sind gültig." >> $GITHUB_STEP_SUMMARY
            echo "Veröffentlicht wurde nichts — dieser Lauf hat nur gefragt." >> $GITHUB_STEP_SUMMARY
          else
            echo "Token oder Konto-Kennung werden abgelehnt." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # **Nimmt die offene Beta schon Tester an?** Davon haengt ab, ob der
      # TestFlight-Knopf auf die Seite kommt. Gefragt wird bei Apple, nicht
      # geraten: Der Link existiert ab dem Anlegen der Gruppe, funktioniert
      # aber erst nach der Freigabe des Baus.
      - name: TestFlight-Stand
        id: testflight
        if: ${{ !inputs.nur_zugang }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "offen=nein" >> "$GITHUB_OUTPUT"
            echo "Kein Apple-Zugang in diesem Lauf — Knopf bleibt weg."
            exit 0
          fi
          pip install --quiet "pyjwt[crypto]" requests
          # Das Skript endet auch mit 1, wenn die Frage selbst scheitert. Das
          # darf die Website nicht aufhalten — dann eben ohne Knopf.
          echo "offen=$(python3 scripts/testflight-stand.py || echo nein)" >> "$GITHUB_OUTPUT"

      # Rechtstexte aus `public/` dazulegen — eine Quelle, zwei Ziele.
      - name: Auslieferordner zusammenstellen
        if: ${{ !inputs.nur_zugang }}
        env:
          TESTFLIGHT_OFFEN: ${{ steps.testflight.outputs.offen }}
        run: |
          chmod +x scripts/website-bauen.sh
          scripts/website-bauen.sh build/website

      # **Erst prüfen, dann veröffentlichen.** Eine Seite mit einer offenen
      # Textlücke im Impressum ist schlimmer als keine Seite.
      - name: Website prüfen
        id: pruefung
        if: ${{ !inputs.nur_zugang }}
        run: node scripts/check-website.mjs build/website

      # Damit im Actions-Tab steht, WARUM nichts online ging, ohne dass jemand
      # das Protokoll aufklappen muss. Der haeufigste Grund ist bekannt: Das
      # Impressum steht mit Platzhaltern da und braucht eine ladungsfähige
      # Anschrift.
      - name: Warum die Seite nicht durchkam
        if: failure() && steps.pruefung.outcome == 'failure'
        run: |
          echo "### Nicht veröffentlicht — die Prüfung hat abgelehnt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Die beanstandeten Punkte stehen im Protokoll des Schritts" >> $GITHUB_STEP_SUMMARY
          echo "„Website prüfen\"." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Steht dort ein Platzhalter aus \`impressum.html\`: Die Seite" >> $GITHUB_STEP_SUMMARY
          echo "braucht eine ladungsfähige Anschrift in \`public/impressum.html\`." >> $GITHUB_STEP_SUMMARY
          echo "Bis dahin geht sie absichtlich nicht online." >> $GITHUB_STEP_SUMMARY

      # **Auch das Projekt legt der Ablauf an.** „Project not found" beim
      # ersten Hochladen ist sonst der wahrscheinlichste Ausgang.
      - name: Pages-Projekt sicherstellen
        if: ${{ !inputs.nur_zugang && steps.zugang.outputs.bereit == 'ja' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Dieselbe Fassung, die `wrangler-action` unten benutzt. Stünde hier
          # eine andere, wäre das eine zweite Version, die auseinanderlaufen kann.
          WRANGLER="wrangler@3.90.0"
          if npx --yes "$WRANGLER" pages project list 2>/dev/null \
               | grep -qE "(^|[^a-z0-9-])${PROJEKT}([^a-z0-9-]|$)"; then
            echo "Pages-Projekt „$PROJEKT\" steht."
          else
            echo "Pages-Projekt „$PROJEKT\" gibt es nicht — wird angelegt."
            npx --yes "$WRANGLER" pages project create "$PROJEKT" --production-branch=main
          fi

      - name: Zu Cloudflare Pages hochladen
        if: ${{ !inputs.nur_zugang && steps.zugang.outputs.bereit == 'ja' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch=main` macht daraus die Produktionsfassung, nicht eine
          # Vorschau. `--commit-dirty` schweigt die Warnung, dass der
          # Arbeitsordner Dateien enthält, die nicht im Repository stehen —
          # das ist hier der frisch gebaute Ordner selbst.
          command: pages deploy build/website --project-name=stack-and-siege --branch=main --commit-dirty=true

      # Ein Lauf, der nur geprüft hat, sieht im Actions-Tab genauso grün aus
      # wie einer, der veröffentlicht hat. Genau daran ist der iOS-Bau einmal
      # vorbeigelaufen; deshalb sagt der Lauf hier selbst, was er getan hat.
      - name: Was dieser Lauf getan hat
        if: always()
        run: |
          if [ "${{ inputs.nur_zugang }}" = "true" ]; then
            echo "### Nur der Zugang wurde geprüft" >> $GITHUB_STEP_SUMMARY
            echo "Weder gebaut noch veröffentlicht — so war der Lauf gemeint." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.zugang.outputs.bereit }}" = "ja" ]; then
            echo "### Veröffentlicht" >> $GITHUB_STEP_SUMMARY
            echo "Die Seite steht auf https://${PROJEKT}.pages.dev/" >> $GITHUB_STEP_SUMMARY
          else
            echo "### NUR GEPRÜFT — nichts veröffentlicht" >> $GITHUB_STEP_SUMMARY
            echo "CLOUDFLARE_API_TOKEN oder CLOUDFLARE_ACCOUNT_ID fehlt in den" >> $GITHUB_STEP_SUMMARY
            echo "Repository-Secrets. Die Seite ist geprüft, aber nicht hochgeladen." >> $GITHUB_STEP_SUMMARY
            echo "::warning::Cloudflare ist noch nicht eingerichtet — die Seite wurde geprüft, aber nicht veröffentlicht."
          fi
          cat $GITHUB_STEP_SUMMARY
