name: iOS-Build (TestFlight)

# Bewusst NICHT bei jedem Push: ein TestFlight-Upload ist eine
# Aussenwirkung. Der Build laeuft auf Zuruf oder wenn ein Versions-Tag
# entsteht — dann ist die Absicht eindeutig.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Nach TestFlight hochladen (sonst nur bauen und pruefen)'
        type: boolean
        default: false
  push:
    tags: ['v*']

# macOS-Runner sind fuer OEFFENTLICHE Repositories kostenlos. Waere das
# Repository privat, zaehlten die Minuten zehnfach.
#
# macos-15 statt macos-14: das aeltere Abbild liefert als Standard Xcode 15.4
# (Swift 5.10). Damit uebersetzt Capacitor 8 nicht — die Plugins finden dann
# saemtliche Swift-Erweiterungen des Capacitor-Moduls nicht mehr und melden
# reihenweise "has no member" (webView, viewController, reject, getString).
#
# Unabhaengig davon nimmt Apple seit dem 28.04.2026 nur noch Uploads an, die
# mit dem iOS-26-SDK gebaut wurden. Deshalb ist Xcode 26 hier keine Kuer,
# sondern Bedingung — und der Lauf prueft das, statt es zu hoffen.
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswaehlen
        run: |
          # Nicht auf den Standard des Abbilds verlassen: der wechselt mit
          # jeder Runner-Aktualisierung. Statt eine Version festzunageln, die
          # irgendwann verschwindet, nehmen wir die neueste vorhandene — und
          # brechen ab, wenn sie zu alt ist. Die Liste wird mitprotokolliert,
          # damit ein Fehlschlag sofort zeigt, was verfuegbar gewesen waere.
          BEST=""; BESTV=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null) || continue
            echo "vorhanden: $app  ->  $v"
            if [ -z "$BESTV" ] || [ "$(printf '%s\n%s\n' "$BESTV" "$v" | sort -V | tail -1)" = "$v" ]; then
              BESTV="$v"; BEST="$app"
            fi
          done
          [ -n "$BEST" ] || { echo "FEHLER: kein Xcode auf dem Runner gefunden"; exit 1; }
          if [ "${BESTV%%.*}" -lt 26 ]; then
            echo "FEHLER: neuestes Xcode ist $BESTV, gebraucht wird mindestens 26."
            echo "Apple nimmt seit dem 28.04.2026 nur noch Uploads an, die mit dem"
            echo "iOS-26-SDK gebaut wurden. Ein aelteres Xcode wuerde uebersetzen"
            echo "und erst beim Hochladen abgelehnt - das faellt hier auf."
            exit 1
          fi
          sudo xcode-select -s "$BEST/Contents/Developer"
          echo "gewaehlt: $BEST ($BESTV)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhaengigkeiten
        run: npm ci

      # Dieselben Gates wie beim Web-Deploy. Eine App, die die Tests nicht
      # besteht, hat in TestFlight nichts verloren.
      - name: Typen pruefen
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test:unit

      - name: Weboberflaeche bauen
        run: npm run build

      - name: Bundle auf Fremdquellen pruefen
        run: |
          # Apple 2.5.2: kein Nachladen von ausfuehrbarem Code. Ausserdem waere
          # die App beim ersten Start ohne Netz sonst leer.
          if grep -rqE "unpkg\.com|gstatic\.com/firebasejs" dist/index.html dist/assets/*.js; then
            echo "FEHLER: externe Skript-URL im Bundle — Apple 2.5.2"; exit 1
          fi
          test -d dist/sounds || { echo "sounds/ fehlt"; exit 1; }
          # music/ lag bis v3.78.1 ausserhalb von public/ und fehlte still
          # im Build — die Hintergrundmusik war tot, ohne dass etwas brach.
          test "$(ls dist/music/*.mp3 2>/dev/null | wc -l)" -ge 8 || { echo "music/ fehlt"; exit 1; }
          echo "Bundle ist in sich geschlossen"

      - name: Capacitor synchronisieren
        run: npx cap sync ios

      - name: Signierung einrichten
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # Fehlende Geheimnisse zuerst benennen. Ohne diese Pruefung
          # entstuende ein leerer Schluesselbund, und der Fehler kaeme erst
          # viel spaeter als unverstaendliche codesign-Meldung.
          for v in CERT_P12 CERT_PASSWORD PROFILE; do
            eval "[ -n \"\${$v}\" ]" || { echo "FEHLER: Secret fuer $v fehlt — siehe IOS-SETUP.md"; exit 1; }
          done
          # Eigener Schluesselbund: der Standard-Bund des Runners ist gesperrt
          # und wuerde xcodebuild bei jedem Signieren nach einem Passwort fragen.
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/fortress.mobileprovision
          rm -f $RUNNER_TEMP/cert.p12

      # Der SIGNIERUNGSFREIE Probelauf. Ohne diesen Schritt prueft ein Lauf ohne
      # Geheimnisse gar keinen Xcode-Vorgang — er sagt dann nur, dass npm
      # funktioniert, und beantwortet die eigentliche Frage nicht.
      # CODE_SIGNING_ALLOWED=NO uebersetzt vollstaendig, ohne Zertifikat.
      - name: Probe-Uebersetzung ohne Signierung
        if: ${{ !inputs.upload && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Probe.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          echo "Release fuer das Geraet: uebersetzt."

      # Zweiter Durchgang fuer den Simulator, in der Debug-Konfiguration —
      # also genau das, was beim Druck auf "Run" in Xcode passiert. Der
      # Geraete-Bogen oben beweist das nicht mit: andere Architektur, andere
      # Konfiguration. Wer die App lokal ausprobieren will, soll nicht der
      # erste sein, der einen Fehler in diesem Pfad findet.
      - name: Probe-Uebersetzung fuer den Simulator
        if: ${{ !inputs.upload && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath $RUNNER_TEMP/dd-sim \
            build
          echo "Debug fuer den Simulator: uebersetzt."

      - name: Archivieren
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # -project, NICHT -workspace: Capacitor 8 bindet die Plugins ueber
          # Swift Package Manager ein, es entsteht also kein .xcworkspace mehr
          # (mit CocoaPods war das frueher anders).
          #
          # CODE_SIGN_STYLE steht im Projekt auf Automatic — das ist der Wert,
          # der beim Oeffnen in Xcode auf einem Entwicklerrechner gebraucht
          # wird. Nur die CI braucht Manual, weil dort kein Xcode-Konto
          # angemeldet ist, das automatisch ein Profil erzeugen koennte. Auf der
          # Kommandozeile gesetzt gilt das genau hier und nirgends sonst.
          #
          # CURRENT_PROJECT_VERSION ist die Build-Nummer: TestFlight lehnt jeden
          # Upload mit bereits bekannter Nummer ab. Die Lauf-Nummer steigt
          # monoton und wird nie vergessen. Sie hier zu setzen statt die
          # Info.plist umzuschreiben ist der Weg, der nicht still danebengehen
          # kann — die plist verweist bereits auf genau diese Einstellung.
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROFILE_NAME }}" \
            archive

      - name: IPA exportieren
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFIL: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          # Die Vorlage enthaelt Platzhalter: in einer plist findet KEINE
          # Variablen-Ersetzung statt, die Werte muessen woertlich dort stehen.
          [ -n "$TEAM" ]   || { echo "FEHLER: Secret APPLE_TEAM_ID fehlt"; exit 1; }
          [ -n "$PROFIL" ] || { echo "FEHLER: Secret IOS_PROFILE_NAME fehlt"; exit 1; }
          cp ios/ExportOptions.plist $RUNNER_TEMP/ExportOptions.plist
          # PlistBuddy statt sed: Profilnamen enthalten fast immer Leerzeichen
          # und duerfen jedes Zeichen tragen — ein Trennzeichen in einem
          # sed-Ausdruck waere frueher oder spaeter genau das falsche.
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM" $RUNNER_TEMP/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:de.skkjbeer.fortress $PROFIL" \
            $RUNNER_TEMP/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Nach TestFlight hochladen
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # API-Schluessel statt app-spezifischem Passwort: kein persoenliches
          # Apple-Passwort im Repository, jederzeit in App Store Connect
          # widerrufbar.
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/export/App.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ~/private_keys

      # Ohne Signierung endet der Lauf hier — das ist der nuetzliche Fall
      # "baut die App ueberhaupt?", den man ohne jedes Geheimnis fahren kann.
      - name: Weboberflaeche als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
