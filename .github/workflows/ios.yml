name: iOS-Build (TestFlight)

# Bewusst NICHT bei jedem Push: ein TestFlight-Upload ist eine
# Aussenwirkung. Der Build laeuft auf Zuruf oder wenn ein Versions-Tag
# entsteht — dann ist die Absicht eindeutig.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Nach TestFlight hochladen (sonst nur bauen und pruefen)'
        type: boolean
        default: false
  push:
    tags: ['v*']

# macOS-Runner sind fuer OEFFENTLICHE Repositories kostenlos. Waere das
# Repository privat, zaehlten die Minuten zehnfach.
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhaengigkeiten
        run: npm ci

      # Dieselben Gates wie beim Web-Deploy. Eine App, die die Tests nicht
      # besteht, hat in TestFlight nichts verloren.
      - name: Typen pruefen
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test:unit

      - name: Weboberflaeche bauen
        run: npm run build

      - name: Bundle auf Fremdquellen pruefen
        run: |
          # Apple 2.5.2: kein Nachladen von ausfuehrbarem Code. Ausserdem waere
          # die App beim ersten Start ohne Netz sonst leer.
          if grep -rqE "unpkg\.com|gstatic\.com/firebasejs" dist/index.html dist/assets/*.js; then
            echo "FEHLER: externe Skript-URL im Bundle — Apple 2.5.2"; exit 1
          fi
          test -d dist/sounds || { echo "sounds/ fehlt"; exit 1; }
          # music/ lag bis v3.78.1 ausserhalb von public/ und fehlte still
          # im Build — die Hintergrundmusik war tot, ohne dass etwas brach.
          test "$(ls dist/music/*.mp3 2>/dev/null | wc -l)" -ge 8 || { echo "music/ fehlt"; exit 1; }
          echo "Bundle ist in sich geschlossen"

      - name: Capacitor synchronisieren
        run: npx cap sync ios

      - name: Build-Nummer setzen
        run: |
          # TestFlight lehnt jeden Upload mit bereits bekannter Build-Nummer ab.
          # Die Lauf-Nummer steigt monoton und ist damit die einfachste Quelle,
          # die nie kollidiert — von Hand gepflegte Zahlen werden vergessen.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" \
            ios/App/App/Info.plist 2>/dev/null || true
          echo "Build-Nummer: ${{ github.run_number }}"

      - name: Signierung einrichten
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # Eigener Schluesselbund: der Standard-Bund des Runners ist gesperrt
          # und wuerde xcodebuild bei jedem Signieren nach einem Passwort fragen.
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/fortress.mobileprovision
          rm -f $RUNNER_TEMP/cert.p12

      # Der SIGNIERUNGSFREIE Probelauf. Ohne diesen Schritt prueft ein Lauf ohne
      # Geheimnisse gar keinen Xcode-Vorgang — er sagt dann nur, dass npm
      # funktioniert, und beantwortet die eigentliche Frage nicht.
      # CODE_SIGNING_ALLOWED=NO uebersetzt vollstaendig, ohne Zertifikat.
      - name: Probe-Uebersetzung ohne Signierung
        if: ${{ !inputs.upload && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Probe.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          echo "Die App uebersetzt sauber."

      - name: Archivieren
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # -project, NICHT -workspace: Capacitor 8 bindet die Plugins ueber
          # Swift Package Manager ein, es entsteht also kein .xcworkspace mehr
          # (mit CocoaPods war das frueher anders).
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROFILE_NAME }}" \
            archive

      - name: IPA exportieren
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Die Vorlage enthaelt einen Platzhalter: in einer plist findet KEINE
          # Variablen-Ersetzung statt, die Kennung muss woertlich dort stehen.
          sed "s/APPLE_TEAM_ID_PLATZHALTER/$TEAM/" ios/ExportOptions.plist > $RUNNER_TEMP/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Nach TestFlight hochladen
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # API-Schluessel statt app-spezifischem Passwort: kein persoenliches
          # Apple-Passwort im Repository, jederzeit in App Store Connect
          # widerrufbar.
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/export/App.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ~/private_keys

      # Ohne Signierung endet der Lauf hier — das ist der nuetzliche Fall
      # "baut die App ueberhaupt?", den man ohne jedes Geheimnis fahren kann.
      - name: Weboberflaeche als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
