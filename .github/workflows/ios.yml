name: iOS-Build (TestFlight)

# Bewusst NICHT bei jedem Push: ein TestFlight-Upload ist eine
# Aussenwirkung. Der Build laeuft auf Zuruf oder wenn ein Versions-Tag
# entsteht — dann ist die Absicht eindeutig.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Nach TestFlight hochladen (sonst nur bauen und pruefen)'
        type: boolean
        default: false
  push:
    tags: ['v*']

# macOS-Runner sind fuer OEFFENTLICHE Repositories kostenlos. Waere das
# Repository privat, zaehlten die Minuten zehnfach.
#
# macos-15 statt macos-14: das aeltere Abbild liefert als Standard Xcode 15.4
# (Swift 5.10). Damit uebersetzt Capacitor 8 nicht — die Plugins finden dann
# saemtliche Swift-Erweiterungen des Capacitor-Moduls nicht mehr und melden
# reihenweise "has no member" (webView, viewController, reject, getString).
#
# Unabhaengig davon nimmt Apple seit dem 28.04.2026 nur noch Uploads an, die
# mit dem iOS-26-SDK gebaut wurden. Deshalb ist Xcode 26 hier keine Kuer,
# sondern Bedingung — und der Lauf prueft das, statt es zu hoffen.
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswaehlen
        run: |
          # Nicht auf den Standard des Abbilds verlassen: der wechselt mit
          # jeder Runner-Aktualisierung. Statt eine Version festzunageln, die
          # irgendwann verschwindet, nehmen wir die neueste vorhandene — und
          # brechen ab, wenn sie zu alt ist. Die Liste wird mitprotokolliert,
          # damit ein Fehlschlag sofort zeigt, was verfuegbar gewesen waere.
          BEST=""; BESTV=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null) || continue
            echo "vorhanden: $app  ->  $v"
            if [ -z "$BESTV" ] || [ "$(printf '%s\n%s\n' "$BESTV" "$v" | sort -V | tail -1)" = "$v" ]; then
              BESTV="$v"; BEST="$app"
            fi
          done
          [ -n "$BEST" ] || { echo "FEHLER: kein Xcode auf dem Runner gefunden"; exit 1; }
          if [ "${BESTV%%.*}" -lt 26 ]; then
            echo "FEHLER: neuestes Xcode ist $BESTV, gebraucht wird mindestens 26."
            echo "Apple nimmt seit dem 28.04.2026 nur noch Uploads an, die mit dem"
            echo "iOS-26-SDK gebaut wurden. Ein aelteres Xcode wuerde uebersetzen"
            echo "und erst beim Hochladen abgelehnt - das faellt hier auf."
            exit 1
          fi
          sudo xcode-select -s "$BEST/Contents/Developer"
          echo "gewaehlt: $BEST ($BESTV)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhaengigkeiten
        run: npm ci

      # Dieselben Gates wie beim Web-Deploy. Eine App, die die Tests nicht
      # besteht, hat in TestFlight nichts verloren.
      # ZUERST die statische Pruefung der iOS-Huelle. Sie braucht eine Sekunde
      # und faengt genau die Fehler ab, die sonst erst nach sechs Minuten
      # Uebersetzen auffallen — oder, beim Alphakanal im Symbol, erst per
      # E-Mail von Apple, nach dem Hochladen.
      - name: iOS-Huelle pruefen
        run: npm run test:ios

      - name: Typen pruefen
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test:unit

      - name: Weboberflaeche bauen
        run: npm run build

      - name: Bundle auf Fremdquellen pruefen
        run: |
          # Apple 2.5.2: kein Nachladen von ausfuehrbarem Code. Ausserdem waere
          # die App beim ersten Start ohne Netz sonst leer.
          if grep -rqE "unpkg\.com|gstatic\.com/firebasejs" dist/index.html dist/assets/*.js; then
            echo "FEHLER: externe Skript-URL im Bundle — Apple 2.5.2"; exit 1
          fi
          test -d dist/sounds || { echo "sounds/ fehlt"; exit 1; }
          # music/ lag bis v3.78.1 ausserhalb von public/ und fehlte still
          # im Build — die Hintergrundmusik war tot, ohne dass etwas brach.
          test "$(ls dist/music/*.mp3 2>/dev/null | wc -l)" -ge 8 || { echo "music/ fehlt"; exit 1; }
          echo "Bundle ist in sich geschlossen"

      - name: Capacitor synchronisieren
        run: npx cap sync ios

      # **Vier Angaben, und keine davon verlangt einen Mac.**
      #
      # Frueher standen hier sieben Geheimnisse, darunter ein aus dem
      # Schluesselbund ausgefuehrtes .p12 und eine Profildatei aus dem Portal.
      # Beides ist entbehrlich: Mit einem App-Store-Connect-Schluessel legt
      # xcodebuild Zertifikat und Profil selbst an (-allowProvisioningUpdates).
      # Im Schwesterprojekt laeuft genau dieser Weg auf demselben Apple-Konto.
      #
      # Zuerst pruefen, ob ueberhaupt eingerichtet ist: sonst laeuft der Auftrag
      # zwanzig Minuten und scheitert am Ende an einer Meldung, die nicht sagt,
      # welche der vier Angaben fehlt.
      - name: Zugang pruefen
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          fehlt=""
          [ -n "$ASC_KEY_ID" ]     || fehlt="$fehlt ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ]  || fehlt="$fehlt ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]     || fehlt="$fehlt ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ]  || fehlt="$fehlt APPLE_TEAM_ID"
          if [ -n "$fehlt" ]; then
            echo "::error::Diese Geheimnisse fehlen:$fehlt — siehe IOS-SETUP.md"
            exit 1
          fi
          echo "Alle vier Angaben liegen vor."

      # Der Schluessel muss an ZWEI Orten liegen: xcodebuild bekommt ihn ueber
      # einen Pfad, altool sucht ihn von sich aus in ~/.appstoreconnect.
      - name: Schluessel ablegen
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          cp ~/private_keys/AuthKey_$ASC_KEY_ID.p8 ~/.appstoreconnect/private_keys/
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      # Der SIGNIERUNGSFREIE Probelauf. Ohne diesen Schritt prueft ein Lauf ohne
      # Geheimnisse gar keinen Xcode-Vorgang — er sagt dann nur, dass npm
      # funktioniert, und beantwortet die eigentliche Frage nicht.
      # CODE_SIGNING_ALLOWED=NO uebersetzt vollstaendig, ohne Zertifikat.
      - name: Probe-Uebersetzung ohne Signierung
        if: ${{ !inputs.upload && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Probe.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          echo "Release fuer das Geraet: uebersetzt."

          # **Uebersetzen heisst nicht, dass etwas drin ist.** Ein Capacitor-Bau
          # gelingt auch dann, wenn `cap sync` die Weboberflaeche nicht
          # mitgenommen hat — das Ergebnis waere eine App, die startet und eine
          # weisse Flaeche zeigt. Genau das faellt sonst erst dem Pruefer auf.
          APP="$RUNNER_TEMP/Probe.xcarchive/Products/Applications/App.app"
          test -d "$APP" || { echo "FEHLER: kein App-Bundle im Archiv"; exit 1; }
          test -s "$APP/public/index.html" || { echo "FEHLER: public/index.html fehlt im Bundle"; exit 1; }
          ls "$APP/public/assets/"*.js >/dev/null 2>&1 || { echo "FEHLER: kein Spielcode im Bundle"; exit 1; }
          test "$(ls "$APP/public/music/"*.mp3 2>/dev/null | wc -l)" -ge 8 || { echo "FEHLER: Musik fehlt im Bundle"; exit 1; }
          test -d "$APP/public/sounds" || { echo "FEHLER: Toene fehlen im Bundle"; exit 1; }
          # Die Angaben, an denen ein Upload sonst still scheitert.
          KENN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          BAU=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          AUSFUHR=$(/usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$APP/Info.plist")
          [ "$KENN" = "de.skkjbeer.stackandsiege" ] || { echo "FEHLER: Bundle-ID ist $KENN"; exit 1; }
          [ "$BAU" = "${{ github.run_number }}" ] || { echo "FEHLER: Build-Nummer ist $BAU statt ${{ github.run_number }}"; exit 1; }
          [ "$AUSFUHR" = "false" ] || { echo "FEHLER: Ausfuhrangabe fehlt — jeder Build bliebe in Missing Compliance"; exit 1; }
          echo "Im Bundle: Spielcode, $(ls "$APP/public/music/"*.mp3 | wc -l | tr -d ' ') Musikstuecke, Toene."
          echo "Kennung $KENN, Bau $BAU, Ausfuhrangabe gesetzt."

      # ── Der Probelauf im Simulator ────────────────────────────────────
      #
      # **Uebersetzen beweist nicht, dass die App laeuft.** v3.86.0 hat sauber
      # uebersetzt, sauber archiviert, sauber hochgeladen — und war auf dem
      # Geraet nicht zu bedienen: Die Textbedienung war ab dem ersten Bild aus,
      # das Namensfeld im Profil-Editor damit tot. Kein Schritt dieses Ablaufs
      # hat das gesehen, weil keiner die App je gestartet hat.
      #
      # Dieser Schritt startet sie. Er laeuft AUCH bei Hochlade-Laeufen — gerade
      # da: Das ist der Weg, der bei Testern ankommt. Die vier Minuten sind der
      # Preis dafuer, dass ein Startabsturz hier auffaellt und nicht dort.
      #
      # Er ersetzt die fruehere reine Probe-Uebersetzung fuer den Simulator:
      # Wer startet, hat auch uebersetzt.
      - name: Simulator-Probelauf
        run: |
          set -e
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath $RUNNER_TEMP/dd-sim \
            build
          APP=$(find $RUNNER_TEMP/dd-sim/Build/Products -maxdepth 2 -name 'App.app' -type d | head -1)
          [ -n "$APP" ] || { echo "FEHLER: App.app nach dem Uebersetzen nicht gefunden"; exit 1; }

          # Das erste verfuegbare iPhone nehmen, statt eine Modellbezeichnung
          # festzuschreiben: Welche Geraete es gibt, haengt an der Xcode-Fassung
          # des Laeufers, und ein fester Name bricht beim naechsten Abbild.
          UDID=$(xcrun simctl list devices available -j | python3 scripts/sim-geraet.py || true)
          [ -n "$UDID" ] || { echo "FEHLER: kein iPhone-Simulator verfuegbar"; exit 1; }
          echo "Simulator $UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          rm -f ~/Library/Logs/DiagnosticReports/App-*.ips 2>/dev/null || true
          xcrun simctl launch "$UDID" de.skkjbeer.stackandsiege

          # Warten, bis die Weboberflaeche wirklich steht: Splash rund eine
          # Sekunde, danach React und das Menue.
          sleep 15
          mkdir -p "$RUNNER_TEMP/probe"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/probe/start.png"

          # 1) Kein Absturzbericht. Simulator-Abstuerze landen hier als .ips.
          if ls ~/Library/Logs/DiagnosticReports/App-*.ips >/dev/null 2>&1; then
            echo "FEHLER: die App ist im Simulator abgestuerzt:"
            ls -la ~/Library/Logs/DiagnosticReports/App-*.ips
            head -40 ~/Library/Logs/DiagnosticReports/App-*.ips || true
            exit 1
          fi

          # 2) Die Weboberflaeche hat sich gemeldet. Das ist die eigentliche
          #    Aussage: Nicht „ein Fenster ist da", sondern „React ist
          #    gestartet und weiss, welche Fassung es ist". src/game/app.js
          #    schreibt die Zeile nach dem Rendern; Capacitor reicht
          #    console.log ins Systemprotokoll weiter.
          # Zwei Irrwege stecken in diesen vier Zeilen, beide gemessen:
          #
          # 1. NICHT nach dem Marker filtern. `log show` schreibt seine eigene
          #    Aufrufzeile mit ins Protokoll, und die enthaelt den Suchbegriff,
          #    weil er im Filter steht. Die Datei enthielt NUR diese Zeile, und
          #    die Pruefung war gruen, ohne etwas zu pruefen.
          # 2. Der Marker kommt NICHT aus console.log. WebKit reicht
          #    Konsolenausgaben an den Web-Inspektor weiter, nicht an os_log —
          #    im Lauf nachgesehen: 983 Zeilen der App, kein Marker. Er kommt
          #    jetzt aus SpielViewController, sobald die Weboberflaeche die
          #    erste Nachricht ueber die Bruecke schickt. Das beweist mehr:
          #    nicht nur, dass React laeuft, sondern dass die Bruecke traegt.
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process == "App"' \
            > "$RUNNER_TEMP/probe/app-log.txt" 2>&1 || true
          echo "Protokollzeilen der App: $(wc -l < "$RUNNER_TEMP/probe/app-log.txt")"
          echo "Huellen-Marker: $(grep -c 'STACK-SIEGE-HUELLE' "$RUNNER_TEMP/probe/app-log.txt" || true)"
          grep -o 'STACK-SIEGE-[A-Z]* .*' "$RUNNER_TEMP/probe/app-log.txt" | head -4 || true
          if grep -q 'STACK-SIEGE-BEREIT Bruecke steht' "$RUNNER_TEMP/probe/app-log.txt"; then
            echo "Lebenszeichen: $(grep -o 'STACK-SIEGE-BEREIT.*' "$RUNNER_TEMP/probe/app-log.txt" | head -1)"
          else
            echo "FEHLER: Die Weboberflaeche hat sich nicht gemeldet."
            echo "Entweder ist sie nicht gestartet, oder der Ladebildschirm haengt."
            echo "Das Bildschirmfoto und das Protokoll liegen als Artefakt"
            echo "'simulator-probe' bei. Letzte Zeilen:"
            tail -25 "$RUNNER_TEMP/probe/app-log.txt" || true
            exit 1
          fi

          # 3) Der Schirm zeigt etwas. Ein HILFSMASS, kein Beweis: Ein leerer
          #    Schirm komprimiert auf wenige Kilobyte, ein gerendertes Menue
          #    liegt deutlich darueber. Seit Pruefung 2 ist das nur noch die
          #    zweite Meinung — sie faengt den Fall ab, dass React laeuft, aber
          #    nichts zeichnet.
          GROESSE=$(stat -f%z "$RUNNER_TEMP/probe/start.png")
          echo "Bildschirmfoto: $GROESSE Byte"
          [ "$GROESSE" -gt 80000 ] || {
            echo "FEHLER: Das Bild ist mit $GROESSE Byte zu klein — der Schirm ist " \
                 "vermutlich leer. Sieh dir das Artefakt 'simulator-probe' an."; exit 1; }

          echo "Die App startet, meldet sich, stuerzt nicht ab und zeigt etwas."

      - name: Bildschirmfoto des Probelaufs sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-probe
          path: ${{ runner.temp }}/probe
          if-no-files-found: ignore

      # **Das eigene Zertifikat, wenn es eines gibt.**
      #
      # Ohne diesen Schritt legt xcodebuild auf jedem frischen Laeufer ein neues
      # Verteilzertifikat an, und nach dem dritten ist die Grenze des Kontos
      # erreicht — dann steht man vor Handarbeit im Portal, ausgerechnet an dem
      # Weg, der Handarbeit sparen soll. Ein Zertifikat gilt fuer das TEAM, nicht
      # fuer eine App: dasselbe, mit dem das Schwesterprojekt signiert, signiert
      # auch dieses hier.
      #
      # Der Schritt ist freiwillig. Liegt kein Zertifikat, laeuft alles wie
      # bisher — mit einem Hinweis statt eines Abbruchs.
      - name: Zertifikat einlesen
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          P12: ${{ secrets.DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::Kein eigenes Zertifikat hinterlegt — xcodebuild legt eines an. Erlaubt sind drei."
            exit 0
          fi
          # Eigener Schluesselbund: der Anmeldebund des Laeufers ist gesperrt und
          # wuerde codesign nach einem Passwort fragen, das niemand eingibt.
          BUND=$RUNNER_TEMP/signatur.keychain-db
          BUND_PASS=$(openssl rand -base64 24)
          security create-keychain -p "$BUND_PASS" "$BUND"
          security set-keychain-settings -lut 3600 "$BUND"
          security unlock-keychain -p "$BUND_PASS" "$BUND"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/signatur.p12
          # -A statt einzelner -T: einzeln waere sauberer, fuehrt bei codesign
          # aber zu einer Rueckfrage, die auf einem Laeufer niemand beantwortet.
          security import $RUNNER_TEMP/signatur.p12 -k "$BUND" -P "$P12_PASS" -A -t cert -f pkcs12
          security list-keychain -d user -s "$BUND" login.keychain-db
          # Ohne diese Zeile wartet codesign auf das Kennwort des Bundes, bis
          # der Auftrag in die Zeitgrenze laeuft.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$BUND_PASS" "$BUND" >/dev/null
          rm -f $RUNNER_TEMP/signatur.p12
          security find-identity -v -p codesigning "$BUND"

      # **Das Verteilprofil selbst anlegen.**
      #
      # Ohne diesen Schritt sucht die automatische Signierung ein
      # ENTWICKLUNGS-Profil, und das gibt es nur zu einem registrierten Geraet:
      # „Your team has no devices from which to generate a provisioning
      # profile." Daran sind die Laeufe 10 und 11 gescheitert. Die Profilart
      # haengt nicht an der Konfiguration, deshalb half -configuration Release
      # nicht, und -allowProvisioningUpdates auch nicht: es darf Profile
      # anlegen, waehlt aber weiterhin die Entwicklungsart.
      - name: Verteilprofil anlegen
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip3 install --quiet --break-system-packages "pyjwt[crypto]" requests
          python3 scripts/asc-profil.py

      - name: Archivieren
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # -project, NICHT -workspace: Capacitor 8 bindet die Plugins ueber
          # Swift Package Manager ein, es entsteht also kein .xcworkspace mehr
          # (mit CocoaPods war das frueher anders).
          #
          # **Manuell signiert, mit dem Profil aus dem Schritt davor.**
          # Zwei Anlaeufe haben den Weg dorthin gezeigt: Automatic PLUS
          # vorgeschriebene Identitaet lehnt Xcode als Widerspruch ab; Automatic
          # OHNE Identitaet sucht ein Entwicklungsprofil und scheitert am
          # fehlenden Geraet. Manuell mit einem selbst angelegten
          # App-Store-Profil umgeht beides.
          #
          # CURRENT_PROJECT_VERSION ist die Build-Nummer: TestFlight lehnt jeden
          # Upload mit bereits bekannter Nummer ab. Die Lauf-Nummer steigt
          # monoton und wird nie vergessen.
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFIL_NAME" \
            archive

      - name: IPA exportieren
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Die Vorlage enthaelt zwei Platzhalter: in einer plist findet KEINE
          # Variablen-Ersetzung statt, die Werte muessen woertlich dort stehen.
          [ -n "$TEAM" ] || { echo "FEHLER: Secret APPLE_TEAM_ID fehlt"; exit 1; }
          [ -n "$PROFIL_NAME" ] || { echo "FEHLER: Profilname fehlt — lief „Verteilprofil anlegen\"?"; exit 1; }
          cp ios/ExportOptions.plist $RUNNER_TEMP/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM" $RUNNER_TEMP/ExportOptions.plist
          # PROFIL_NAME kommt aus dem Schritt „Verteilprofil anlegen" ueber
          # GITHUB_ENV — eine Quelle fuer Archiv und Export, damit beide
          # garantiert dasselbe Profil meinen.
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:de.skkjbeer.stackandsiege $PROFIL_NAME" \
            $RUNNER_TEMP/ExportOptions.plist
          # Auch der Export braucht den Schluessel: er holt sich dasselbe Profil.
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Nach TestFlight hochladen
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # API-Schluessel statt app-spezifischem Passwort: kein persoenliches
          # Apple-Passwort im Repository, jederzeit in App Store Connect
          # widerrufbar. Er liegt bereits in ~/.appstoreconnect/private_keys,
          # wo altool von sich aus nachsieht.
          xcrun altool --upload-app -f $RUNNER_TEMP/export/App.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ~/private_keys ~/.appstoreconnect

      # Ohne Signierung endet der Lauf hier — das ist der nuetzliche Fall
      # "baut die App ueberhaupt?", den man ohne jedes Geheimnis fahren kann.

      # ABER: dieser Fall sieht im Actions-Tab genauso gruen aus wie ein
      # geglueckter Upload. Genau daran ist Lauf 17 vorbeigelaufen — ohne
      # `upload` uebersprang er Signieren, Archivieren und Hochladen, meldete
      # Erfolg, und der Bau tauchte bei Apple nie auf. Ein uebersprungener
      # Schritt laesst einen Lauf nicht scheitern; deshalb sagt der Lauf jetzt
      # selbst, was er getan hat.
      - name: Was dieser Lauf getan hat
        if: always()
        run: |
          if [ "${{ inputs.upload }}" = "true" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "### Upload-Lauf — IPA ging an TestFlight" >> $GITHUB_STEP_SUMMARY
            echo "Ob Apple ihn annimmt, sagt erst App Store Connect:" >> $GITHUB_STEP_SUMMARY
            echo "Ablauf \"App Store (Stand / Eintragen)\", Modus \`testflight\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "### NUR GEPRUEFT — nichts hochgeladen" >> $GITHUB_STEP_SUMMARY
            echo "Dieser Lauf hat uebersetzt und das Buendel geprueft, aber weder" >> $GITHUB_STEP_SUMMARY
            echo "signiert noch archiviert noch hochgeladen: \`upload\` stand auf false." >> $GITHUB_STEP_SUMMARY
            echo "Fuer TestFlight den Ablauf mit **upload = true** starten." >> $GITHUB_STEP_SUMMARY
          fi
          cat $GITHUB_STEP_SUMMARY

      - name: Weboberflaeche als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
