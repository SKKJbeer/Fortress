name: Deploy to GitHub Pages & Release

on:
  push:
    branches:
      - main
  # Manueller Neustart (Actions-Tab → Run workflow). WICHTIG: Bei Pages-Ausfällen
  # IMMER einen frischen Lauf starten — "Re-run failed jobs" scheitert konstruktiv,
  # weil deploy-pages@v4 dann zwei "github-pages"-Artefakte im selben Lauf findet.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Ein haengender Browser darf nicht stundenlang Laufzeit fressen.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versionsnummer aus index.html lesen
        id: version
        run: |
          # `&amp;` ODER `&` (v3.115.0). Im Titel steht `Stack &amp; Siege` —
          # das alte Muster suchte nur `Stack & Siege` und fand seit v3.79.0
          # NICHTS mehr. Folge: kein Versions-Tag, kein Release seit dem
          # 15.08.; stattdessen ein Release mit dem Tag `v` und dem Namen
          # „Stack & Siege v". Und leer darf die Version hier nie weiterlaufen.
          VERSION=$(grep -oP 'Stack &(amp;)? Siege v\K[0-9]+\.[0-9]+\.[0-9]+' index.html | head -1)
          [ -n "$VERSION" ] || { echo "::error::Keine Version in index.html gefunden"; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Gefundene Version: $VERSION"

      # Seit v3.74.0 wird gebaut (ARCHITEKTUR.md E2). Bricht einer dieser
      # Schritte, wird NICHT deployed — die Live-Version bleibt auf dem letzten
      # funktionierenden Stand stehen, statt kaputt ueberschrieben zu werden.
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhaengigkeiten installieren
        run: npm ci

      # **Diese vier Schritte sind der Riegel vor der Auslieferung.**
      #
      # Bis v3.94.0 stand hier NUR `test:unit`. Die E2E-Suite mit allen
      # Online- und Warteschlangen-Pruefungen lief nie in einem Ablauf — sie
      # konnte kein Deployment aufhalten, und ob sie vor einem Push gelaufen
      # war, hing daran, ob jemand daran gedacht hat. Der Grund war ein fester
      # Pfad auf Playwright, den es nur in einer Umgebung gibt; er steht jetzt
      # in package.json.
      - name: Typen pruefen
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test:unit

      - name: iOS-Huelle pruefen
        run: npm run test:ios

      - name: Bauen
        run: npm run build

      # Die Suite laeuft gegen dist/ und bringt ihren Dateiserver selbst mit.
      # Nur der Browser muss da sein.
      - name: Browser fuer die E2E-Suite
        run: npx playwright install --with-deps chromium

      - name: E2E-Suite (Spiel, Online, Warteschlange, iPad)
        run: npm run test:e2e

      # Bei rotem Lauf sind die Bildschirmfotos der Suite das Einzige, woran
      # man von aussen sieht, WAS kaputt war.
      - name: Bildschirmfotos der Suite sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bildschirmfotos
          path: /tmp/s*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Bauergebnis pruefen
        run: |
          test -f dist/index.html || { echo "dist/index.html fehlt"; exit 1; }
          test -f dist/manifest.json || { echo "manifest.json fehlt"; exit 1; }
          test -d dist/sounds || { echo "sounds/ fehlt"; exit 1; }
          # music/ lag bis v3.78.1 ausserhalb von public/ und fehlte still
          # im Build — die Hintergrundmusik war tot, ohne dass etwas brach.
          test "$(ls dist/music/*.mp3 2>/dev/null | wc -l)" -ge 8 || { echo "music/ fehlt"; exit 1; }
          # Apple 2.5.2 und Offline-Start: im Bundle darf keine fremde
          # Skript-Quelle mehr stehen.
          if grep -rqE "unpkg\.com|gstatic\.com/firebasejs" dist/index.html dist/assets/*.js; then
            echo "FEHLER: externe Skript-URL im Bauergebnis"; exit 1
          fi
          echo "Bauergebnis in Ordnung"

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Git Tag setzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.version }}"
          # WICHTIG: gegen das REMOTE pruefen. actions/checkout holt standardmaessig
          # keine Tags, deshalb fand `git rev-parse` lokal nie einen — der Job
          # versuchte dann einen laengst existierenden Tag zu pushen und schlug fehl
          # (Deploy war da schon erfolgreich, nur der Tag-Schritt wurde rot).
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits, überspringe."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      # **Auf den Commit festgenagelt, nicht auf das bewegliche `v2`.**
      # Ein Marken-Zeiger wie `v2` zeigt auf das, was der Eigentuemer des
      # fremden Repositories gerade darunter legt. Dieser Schritt laeuft mit
      # `contents: write` und dem GITHUB_TOKEN — wer den Zeiger verschiebt,
      # bekommt beides. Genau so sind 2025 mehrere Lieferketten-Vorfaelle
      # gelaufen. Der Commit unten ist der, auf den `v2` am 21.09.2026 zeigte.
      # Zum Anheben: `git ls-remote https://github.com/softprops/action-gh-release refs/tags/v2`
      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Stack & Siege v${{ steps.version.outputs.version }}
          body: |
            ## Stack & Siege v${{ steps.version.outputs.version }}

            Automatisch deployt auf [GitHub Pages](https://skkjbeer.github.io/Fortress/).

            Changelog siehe [FORTRESS-SPEC.md](https://github.com/SKKJbeer/Fortress/blob/main/FORTRESS-SPEC.md).
          files: index.html
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
